<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VizEngine — examples</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px;
    background: #ececec; color: #1a1a1a;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; gap: 10px; align-items: center; padding: 12px 18px;
    border-bottom: 1px dashed #999; background: #fff; flex-wrap: wrap;
  }
  header b { font-size: 15px; }
  header .sub { color: #6b6b6b; margin-right: auto; }
  select, a.btn {
    font: inherit; background: #fff; border: 1px solid #1a1a1a; color: inherit;
    padding: 5px 12px; cursor: pointer; text-decoration: none;
    box-shadow: 2px 2px 0 rgba(0,0,0,.15);
  }
  main {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
    gap: 18px; padding: 18px; max-width: 1900px; margin: 0 auto;
  }
  .card { border: 1px solid #1a1a1a; background: #fff; box-shadow: 4px 4px 0 rgba(0,0,0,.12); display: flex; flex-direction: column; }
  .card > h2 { margin: 0; padding: 10px 14px; font-size: 14px; border-bottom: 1px dashed #999; }
  .card > .note { padding: 6px 14px; color: #6b6b6b; border-bottom: 1px dashed #ddd; }
  .card .panel { flex: 1; overflow: auto; max-height: 560px; }
  details { border-top: 1px dashed #999; }
  details summary { cursor: pointer; padding: 6px 14px; color: #6b6b6b; user-select: none; }
  details pre {
    margin: 0; padding: 10px 14px; background: #f7f7f7; overflow-x: auto;
    border-top: 1px dashed #ddd; font-size: 12px; line-height: 1.5;
  }
  #errors { color: #b00020; }
</style>
</head>
<body>
<header>
  <b>VizEngine examples</b>
  <span class="sub" id="count"></span>
  <span id="errors"></span>
  <label>theme <select id="theme"></select></label>
  <a class="btn" href="./animations.html">animations →</a>
  <a class="btn" href="./editor.html">editor →</a>
  <a class="btn" href="./composer.html">composer →</a>
  <a class="btn" href="./index.html">playground →</a>
</header>
<main id="grid"></main>
<script src="../dist/vizengine.js"></script>
<script src="./sample.js"></script>
<script src="./examples-data.js"></script>
<script>
  window.onerror = (msg) => { document.getElementById('errors').textContent = 'ERROR: ' + msg; };

  const params = new URLSearchParams(location.search);
  const initialTheme = VizEngine.themes.includes(params.get('theme')) ? params.get('theme') : 'kind';

  const themeSel = document.getElementById('theme');
  for (const t of VizEngine.themes) {
    const o = document.createElement('option');
    o.value = o.textContent = t;
    if (t === initialTheme) o.selected = true;
    themeSel.appendChild(o);
  }

  const grid = document.getElementById('grid');
  const panels = [];

  let lastSection = null;
  for (const ex of window.VIZ_EXAMPLES) {
    if (ex.section && ex.section !== lastSection) {
      lastSection = ex.section;
      const sec = document.createElement('div');
      sec.style.cssText = 'grid-column:1/-1;font-weight:700;font-size:16px;padding:10px 4px 2px;border-bottom:1px solid #1a1a1a;margin-top:8px';
      sec.textContent = ex.section;
      grid.appendChild(sec);
    }
    const card = document.createElement('div');
    card.className = 'card';
    const h = document.createElement('h2');
    h.textContent = ex.title;
    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = ex.note;
    const holder = document.createElement('div');
    holder.className = 'panel';
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = 'view source';
    const pre = document.createElement('pre');
    pre.textContent = ex.source;
    details.append(summary, pre);
    card.append(h, note, holder, details);
    grid.appendChild(card);

    const panel = new VizEngine.Panel(holder, {
      theme: initialTheme,
      onNodeClick: (n) => { note.textContent = `clicked → ${n.id} (${n.label})`; },
    });
    panels.push(panel);

    if (ex.stream) {
      const loop = () => {
        panel.clear();
        let i = 0;
        const t = setInterval(() => {
          panel.stream(ex.source.slice(i, i + 16));
          i += 16;
          if (i >= ex.source.length) {
            clearInterval(t);
            setTimeout(loop, 2000);
          }
        }, 60);
      };
      loop();
    } else {
      panel.render(ex.source);
    }
  }

  const nComp = (window.VIZ_COMPONENTS || []).length;
  const nCards = panels.length;
  const nVariants = (window.VIZ_EXAMPLES || []).reduce(
    (sum, ex) => sum + (typeof ex.source === 'string' ? (ex.source.match(/^#### /gm) || []).length : 0), 0);
  document.getElementById('count').textContent = `${nComp} components · ${nCards} example cards · ${nVariants} detailed variants · 20 themes`;
  themeSel.onchange = () => {
    for (let i = 0; i < panels.length; i++) {
      const ex = window.VIZ_EXAMPLES[i];
      panels[i].setTheme(themeSel.value);
      if (!ex.stream) panels[i].render(ex.source);
    }
  };
</script>
</body>
</html>
